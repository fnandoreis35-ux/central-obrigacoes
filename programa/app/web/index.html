<style>
/* Layout: barra lateral de navegação + área de trabalho com faixa de indicadores e tabela densa; gaveta à direita para detalhes */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef4; --line:#d6dce6;
  --ink:#16202e; --ink-2:#4a5669; --ink-3:#7a8597;
  --accent:#2446a8; --accent-soft:#e3e9fb; --accent-ink:#ffffff;
  --ok:#1d7a4b; --ok-soft:#dcf1e5; --warn:#a15c00; --warn-soft:#fbecd3;
  --bad:#b3261e; --bad-soft:#fbe0de; --info:#5b3fa8; --info-soft:#ece6fa;
  --muted-soft:#e7eaef;
  --f-display:"Fraunces", Georgia, serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f141c; --surface:#161d28; --surface-2:#1d2633; --line:#2a3544;
    --ink:#e6ebf2; --ink-2:#a9b4c4; --ink-3:#7c8799;
    --accent:#7d9bf2; --accent-soft:#1f2c4d; --accent-ink:#0f141c;
    --ok:#5fcf93; --ok-soft:#173526; --warn:#f0b35a; --warn-soft:#3a2c14;
    --bad:#f08a82; --bad-soft:#3d1c1a; --info:#b8a3f5; --info-soft:#2a2244;
    --muted-soft:#222b37;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f141c; --surface:#161d28; --surface-2:#1d2633; --line:#2a3544;
  --ink:#e6ebf2; --ink-2:#a9b4c4; --ink-3:#7c8799;
  --accent:#7d9bf2; --accent-soft:#1f2c4d; --accent-ink:#0f141c;
  --ok:#5fcf93; --ok-soft:#173526; --warn:#f0b35a; --warn-soft:#3a2c14;
  --bad:#f08a82; --bad-soft:#3d1c1a; --info:#b8a3f5; --info-soft:#2a2244;

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
// ===== Regras de vencimento (compartilhadas pelo painel e pela skill) =====
const Venc = (() => {
  const pad = n => String(n).padStart(2, "0");
  const iso = d => d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  const mk = (y, m, d) => new Date(Date.UTC(y, m - 1, d)); // m 1-12, aceita overflow
  const lastDay = (y, m) => mk(y, m + 1, 0).getUTCDate();
  function isUtil(d, fer) { const w = d.getUTCDay(); return w !== 0 && w !== 6 && !fer.has(iso(d)); }
  function shift(d, n) { return new Date(d.getTime() + n * 86400000); }
  // competência "AAAA-MM" -> se a obrigação se aplica e qual o vencimento ISO
  function aplica(ob, comp) {
    const m = +comp.slice(5, 7);
    if (ob.periodicidade === "trimestral") return m % 3 === 0;
    if (ob.periodicidade === "anual") return m === (+ob.mesBase || 12);
    return true;
  }
  function calcular(ob, comp, feriados) {
    if (!aplica(ob, comp)) return null;
    const fer = new Set(feriados || []);
    const y0 = +comp.slice(0, 4), m0 = +comp.slice(5, 7);
    const alvo = mk(y0, m0 + (+ob.mesOffset || 0), 1);
    const y = alvo.getUTCFullYear(), m = alvo.getUTCMonth() + 1;
    let d;
    if (ob.regra === "ultimo_util") {
      d = mk(y, m, lastDay(y, m));
      while (!isUtil(d, fer)) d = shift(d, -1);
      return iso(d);
    }
    if (ob.regra === "dia_util") {
      let n = 0; d = mk(y, m, 1);
      while (true) { if (isUtil(d, fer) && ++n >= (+ob.dia || 1)) break; d = shift(d, 1); }
      return iso(d);
    }
    d = mk(y, m, Math.min(+ob.dia || 1, lastDay(y, m)));
    if (ob.ajuste === "antecipa") while (!isUtil(d, fer)) d = shift(d, -1);
    else if (ob.ajuste === "posterga") while (!isUtil(d, fer)) d = shift(d, 1);
    return iso(d);
  }
  return { calcular, aplica, iso };
})();
if (typeof module !== "undefined") module.exports = Venc;
</script><script>
// ===== Central de Obrigações =====
const PAINEL_VERSAO = "1.0.0";
const pad = n => String(n).padStart(2, "0");
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hoje = (() => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); })();
const addDias = (isoD, n) => { const d = new Date(isoD + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diasEntre = (a, b) => Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 86400000);
const br = isoD => isoD ? isoD.slice(8, 10) + "/" + isoD.slice(5, 7) + "/" + isoD.slice(0, 4) : "";
const brDH = s => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }); };
const compBR = c => c ? c.slice(5, 7) + "/" + c.slice(0, 4) : "";
const WD = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const wd = isoD => WD[new Date(isoD + "T12:00:00Z").getUTCDay()];
const fmtCNPJ = v => { const d = String(v || "").replace(/\D/g, ""); if (d.length === 14) return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5"); if (d.length === 11) return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4"); return v || ""; };
const money = v => (v === "" || v == null || isNaN(+v)) ? "" : (+v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const prevComp = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };

const STATUS = {
  pendente: "Pendente", andamento: "Em andamento", concluida: "Concluída", enviada: "Enviada ao cliente",
  ciente: "Cliente ciente", dispensada: "Dispensada", atrasada: "Atrasada"
};
const REGIMES = ["Simples Nacional", "MEI", "Lucro Presumido", "Lucro Real", "Imune/Isenta", "Pessoa Física"];
const ESFERAS = ["Federal", "Estadual", "Municipal", "Trabalhista", "Interna"];

const S = {
  db: null, offline: false, loaded: { clientes: false, obrigacoes: false, processos: false, tarefas: false, cfg: false },
  clientes: [], obrig: [], proc: [], tarefas: [], cfg: {},
  view: "agenda", comp: prevComp(), mode: "lista", kpi: null,
  f: { q: "", resp: "", esfera: "", status: "" }, protoF: "abertos", overlay: null
};
const byId = (arr, id) => arr.find(x => x.id === id);
const feriados = () => S.cfg.feriados || [];

// ---------- status derivados ----------
function effStatus(it) {
  if ((it.status === "pendente" || it.status === "andamento") && it.venc && it.venc < hoje) return "atrasada";
  return it.status || "pendente";
}
function envioStatus(e) {
  if (e.status === "ciente") return "ciente";
  const dias = e.enviadoEm ? diasEntre(e.enviadoEm.slice(0, 10), hoje) : 0;
  return dias > (+S.cfg.diasCobranca || 3) ? "semresp" : "aguardando";
}
function pill(st) {
  const cls = { aguardando: "st-enviada", semresp: "st-semresp" }[st] || "st-" + st;
  const lbl = { aguardando: "Aguardando ciência", semresp: "Sem resposta" }[st] || STATUS[st] || st;
  return `<span class="pill ${cls}">${h(lbl)}</span>`;
}
function regraTexto(ob) {
  const off = +ob.mesOffset || 0;
  const mes = off === 0 ? "do próprio mês" : off === 1 ? "do mês seguinte" : `do ${off}º mês seguinte`;
  let t;
  if (ob.regra === "ultimo_util") t = `Último dia útil ${mes}`;
  else if (ob.regra === "dia_util") t = `${ob.dia}º dia útil ${mes}`;
  else t = `Dia ${ob.dia} ${mes}` + (ob.ajuste === "antecipa" ? ", antecipa" : ob.ajuste === "posterga" ? ", prorroga" : "");
  const per = ob.periodicidade === "trimestral" ? " (trimestral)" : ob.periodicidade === "anual" ? ` (anual, base ${pad(ob.mesBase || 12)})` : "";
  return t + per;
}

// ---------- linhas da agenda ----------
function linhas(comp) {
  const out = [];
  for (const t of S.tarefas) {
    if (comp && t.competencia !== comp) continue;
    const c = byId(S.clientes, t.clienteId) || { id: t.clienteId, nome: t.clienteNome || "(cliente removido)" };
    for (const [obId, it] of Object.entries(t.itens || {})) {
      const ob = byId(S.obrig, obId) || { id: obId, sigla: obId, nome: obId, esfera: "" };
      out.push({ t, c, ob, it, st: effStatus(it) });
    }
  }
  return out;
}
function envios(comp) {
  const out = [];
  for (const t of S.tarefas) {
    if (comp && t.competencia !== comp) continue;
    const c = byId(S.clientes, t.clienteId) || { nome: t.clienteNome || "(cliente removido)" };
    (t.envios || []).forEach((e, i) => out.push({ t, c, e, i, st: envioStatus(e) }));
  }
  return out.sort((a, b) => (b.e.enviadoEm || "").localeCompare(a.e.enviadoEm || ""));
}
function aplicaFiltros(rows) {
  const q = S.f.q.trim().toLowerCase();
  return rows.filter(r => {
    if (S.f.resp && (r.it.resp || r.c.resp || "") !== S.f.resp) return false;
    if (S.f.esfera && r.ob.esfera !== S.f.esfera) return false;
    if (S.f.status && r.st !== S.f.status) return false;
    if (q && !(`${r.c.nome} ${r.c.cnpj || ""} ${r.ob.sigla} ${r.ob.nome}`.toLowerCase().includes(q) || String(r.c.cnpj || "").replace(/\D/g, "").includes(q.replace(/\D/g, "") || "§"))) return false;
    if (S.kpi === "atrasadas" && r.st !== "atrasada") return false;
    if (S.kpi === "semana" && !(["pendente", "andamento"].includes(r.st) && r.it.venc >= hoje && r.it.venc <= addDias(hoje, 7))) return false;
    if (S.kpi === "abertas" && !["pendente", "andamento", "atrasada"].includes(r.st)) return false;
    if (S.kpi === "feitas" && !["concluida", "enviada", "ciente", "dispensada"].includes(r.st)) return false;
    return true;
  });
}

// ---------- render ----------
const $main = () => document.getElementById("main");
function render() {
  renderNav();
  const v = S.view;
  let html = S.offline ? `<div class="offline">Não foi possível abrir o banco de dados do programa.</div>` : "";
  html += v === "agenda" ? viewAgenda() : v === "protocolos" ? viewProtocolos() : v === "clientes" ? viewClientes()
    : v === "obrigacoes" ? viewObrig() : v === "processos" ? viewProc() : v === "guias" ? viewGuias() : viewCfg();
  $main().innerHTML = html;
  S.cfgRendered = v === "config" && S.loaded.cfg;
  renderOverlay();
}
function renderNav() {
  const rows = linhas(S.comp);
  const atras = linhas(null).filter(r => r.st === "atrasada").length;
  const aguard = envios(null).filter(x => x.st !== "ciente").length;
  const items = [
    ["agenda", "Agenda", atras ? `${atras} atras.` : ""], ["guias", "Enviar guias", ""], ["protocolos", "Protocolos", aguard || ""],
    ["clientes", "Clientes", S.clientes.length || ""], ["obrigacoes", "Obrigações", S.obrig.length || ""],
    ["processos", "Processos", S.proc.length || ""], ["config", "Configurações", ""]
  ];
  document.getElementById("nav").innerHTML =
    `<div class="brand">${h(S.cfg.nome || "Central de Obrigações")}<small>Obrigações acessórias</small></div>` +
    items.map(([k, l, c]) => `<button data-act="nav" data-v="${k}" ${S.view === k ? 'aria-current="page"' : ""}><span>${l}</span><span class="count">${h(c)}</span></button>`).join("") +
    `<div class="foot">Hoje, ${wd(hoje)} ${br(hoje)}<br>${rows.length} tarefas em ${compBR(S.comp)}<br><span class="mono" style="font-size:10px">painel v${PAINEL_VERSAO}</span></div>`;
}
function compOptions() {
  const set = new Set(S.tarefas.map(t => t.competencia)); set.add(S.comp); set.add(prevComp());
  return [...set].sort().reverse().map(c => `<option value="${c}" ${c === S.comp ? "selected" : ""}>${compBR(c)}</option>`).join("");
}
function loading() { return !S.offline && !(S.loaded.tarefas && S.loaded.clientes && S.loaded.obrigacoes); }

function viewAgenda() {

    feitas: all.filter(r => ["concluida", "enviada", "ciente", "dispensada"].includes(r.st)).length,

  const resps = [...new Set([...(S.cfg.responsaveis || []), ...S.clientes.map(c => c.resp).filter(Boolean)])];
  let html = `<header class="top"><div><h1>Agenda da competência ${compBR(S.comp)}</h1><p class="sub">Prazos, etapas e entregas de cada cliente.</p></div>
  <div class="toolbar"><label class="f">Competência<select id="f-comp" data-act="comp">${compOptions()}</select></label>

  <div class="filters"><input type="text" id="f-q" placeholder="Buscar cliente, CNPJ ou obrigação" value="${h(S.f.q)}" data-act="fq">
  <select id="f-resp" data-act="fresp"><option value="">Todos os responsáveis</option>${resps.map(r => `<option ${S.f.resp === r ? "selected" : ""}>${h(r)}</option>`).join("")}</select>
  <select id="f-esf" data-act="fesf"><option value="">Todas as esferas</option>${ESFERAS.map(e => `<option ${S.f.esfera === e ? "selected" : ""}>${e}</option>`).join("")}</select>
  <select id="f-st" data-act="fst"><option value="">Todos os status</option>${Object.entries(STATUS).map(([v, l]) => `<option value="${v}" ${S.f.status === v ? "selected" : ""}>${l}</option>`).join("")}</select>
  <span class="seg" style="margin-left:auto"><button data-act="mode" data-m="lista" aria-pressed="${S.mode === "lista"}">Lista</button><button data-act="mode" data-m="matriz" aria-pressed="${S.mode === "matriz"}">Matriz</button></span></div>`;
  if (loading()) return html + `<div class="panel empty"><p>Carregando dados do painel…</p></div>`;
  if (!all.length) {
    const semBase = !S.clientes.length ? `Cadastre os clientes e marque as obrigações de cada um em <b>Clientes</b>. Depois gere as tarefas da competência.` : `Clique em <b>Gerar tarefas de ${compBR(S.comp)}</b> para criar a agenda com os vencimentos de cada cliente, calculados pelas regras do catálogo e pelos feriados cadastrados.`;
    return html + `<div class="panel empty"><h3>Nenhuma tarefa em ${compBR(S.comp)}</h3><p>${semBase}</p>${S.clientes.length ? `<button class="btn primary" data-act="gerar">Gerar tarefas</button>` : `<button class="btn primary" data-act="nav" data-v="clientes">Ir para Clientes</button>`}</div>`;

function lista(rows) {
  if (!rows.length) return `<div class="panel empty"><p>Nenhuma tarefa com esses filtros.</p><button class="btn" data-act="limpar">Limpar filtros</button></div>`;
  rows.sort((a, b) => (a.it.venc || "9").localeCompare(b.it.venc || "9") || a.c.nome.localeCompare(b.c.nome));
  let last = null, body = "";
  for (const r of rows) {
    if (r.it.venc !== last) {
      last = r.it.venc; const d = diasEntre(hoje, last);
      const rel = d === 0 ? "hoje" : d === 1 ? "amanhã" : d < 0 ? `há ${-d} dia${d === -1 ? "" : "s"}` : `em ${d} dias`;
      body += `<tr class="group"><td colspan="7">Vence ${wd(last)}, ${br(last)} · ${rel}</td></tr>`;
    }
    const et = r.it.etapas || [], done = et.filter(e => e.ok).length;
    const dcls = r.st === "atrasada" ? "bad" : (["pendente", "andamento"].includes(r.st) && r.it.venc <= addDias(hoje, 3)) ? "warn" : "";
    body += `<tr class="click" data-act="item" data-t="${h(r.t.id)}" data-o="${h(r.ob.id)}">
      <td><b>${h(r.c.nome)}</b><div class="mono muted">${h(fmtCNPJ(r.c.cnpj))}</div></td>
      <td><span class="sigla">${h(r.ob.sigla)}</span> <span class="muted">${h(r.ob.nome)}</span></td>
      <td class="due ${dcls} mono">${br(r.it.venc)}</td>
      <td>${h(r.it.resp || r.c.resp || "—")}</td>
      <td>${et.length ? `<span class="bar"><i style="width:${Math.round(done / et.length * 100)}%"></i></span><span class="mono muted">${done}/${et.length}</span>` : `<span class="muted">—</span>`}</td>
      <td class="mono">${money(r.it.valor)}</td>
      <td>${pill(r.st)}</td></tr>`;
  }
  return `<div class="panel tablewrap"><table><thead><tr><th>Cliente</th><th>Obrigação</th><th>Vencimento</th><th>Responsável</th><th>Etapas</th><th>Valor</th><th>Status</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function matriz(rows) {
  if (!rows.length) return `<div class="panel empty"><p>Nenhuma tarefa com esses filtros.</p></div>`;
  const obs = [...new Map(rows.map(r => [r.ob.id, r.ob])).values()].sort((a, b) => a.sigla.localeCompare(b.sigla));
  const cls = [...new Map(rows.map(r => [r.t.id, r])).values()].sort((a, b) => a.c.nome.localeCompare(b.c.nome));
  const map = new Map(rows.map(r => [r.t.id + "|" + r.ob.id, r]));
  const head = `<tr><th>Cliente</th>${obs.map(o => `<th title="${h(o.nome)}">${h(o.sigla)}</th>`).join("")}<th>Feito</th></tr>`;
  const body = cls.map(cr => {
    let tot = 0, ok = 0;
    const cells = obs.map(o => {
      const r = map.get(cr.t.id + "|" + o.id); if (!r) return `<td></td>`;
      tot++; if (["concluida", "enviada", "ciente", "dispensada"].includes(r.st)) ok++;
      return `<td><button class="cell ${r.st}" data-act="item" data-t="${h(r.t.id)}" data-o="${h(o.id)}" title="${h(o.sigla)} · ${STATUS[r.st]} · vence ${br(r.it.venc)}" aria-label="${h(cr.c.nome)} ${h(o.sigla)}: ${STATUS[r.st]}"></button></td>`;
    }).join("");
    return `<tr><td><b>${h(cr.c.nome)}</b></td>${cells}<td class="mono">${ok}/${tot}</td></tr>`;
  }).join("");
  const lg = ["pendente", "andamento", "atrasada", "concluida", "enviada", "ciente", "dispensada"].map(s => `<span><i class="cell ${s}"></i>${STATUS[s]}</span>`).join("");
  return `<div class="panel"><div class="tablewrap"><table class="matrix"><thead>${head}</thead><tbody>${body}</tbody></table></div><div class="legend">${lg}</div></div>`;
}

  if (S.protoF === "abertos") list = list.filter(x => x.st !== "ciente");

  }).join("");
  return html + `<div class="panel tablewrap"><table><thead><tr><th>Protocolo</th><th>Cliente</th><th>Guias</th><th>Enviado em</th><th>Para</th><th>Ciência</th></tr></thead><tbody>${body}</tbody></table></div>`;

// ---------- overlays ----------
function renderOverlay() {
  const el = document.getElementById("overlay");
  const o = S.overlay;
  if (!o) { el.innerHTML = ""; return; }
  if (o.kind === "item") el.innerHTML = drawerItem(o);
  else if (o.kind === "proto") el.innerHTML = drawerProto(o);
  else if (o.kind === "cli") el.innerHTML = modalCli(o);
  else if (o.kind === "ob") el.innerHTML = modalOb(o);
  else if (o.kind === "pr") el.innerHTML = modalPr(o);
  else if (o.kind === "gerar") el.innerHTML = modalGerar(o);
}
function drawerItem(o) {
  const t = byId(S.tarefas, o.t); if (!t) return "";
  const it = o.draft, ob = byId(S.obrig, o.o) || { sigla: o.o, nome: "" }, c = byId(S.clientes, t.clienteId) || { nome: t.clienteNome || "" };
  const resps = [...new Set([...(S.cfg.responsaveis || []), c.resp, it.resp].filter(Boolean))];
  const envs = (t.envios || []).map((e, i) => ({ e, i })).filter(x => (x.e.itens || []).includes(o.o));
  return `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="Tarefa">

function planoGeracao(comp) {
  const plano = [];
  for (const c of S.clientes) {
    if (c.ativo === false) continue;
    const itens = {};
    for (const obId of c.obrigacoes || []) {
      const ob = byId(S.obrig, obId); if (!ob) continue;
      const venc = Venc.calcular(ob, comp, feriados()); if (!venc) continue;
      const pr = byId(S.proc, ob.processo);
      itens[obId] = { venc, status: "pendente", resp: c.resp || "", etapas: (pr?.etapas || []).map(n => ({ n, ok: false })) };
    }
    if (!Object.keys(itens).length) continue;
    const id = comp + "_" + c.id, ex = byId(S.tarefas, id);
    const novos = Object.fromEntries(Object.entries(itens).filter(([k]) => !(ex && ex.itens && ex.itens[k])));
    plano.push({ id, c, novos, existe: !!ex, n: Object.keys(novos).length });
  }
  return plano;
}
function modalGerar(o) {
  const plano = planoGeracao(S.comp), total = plano.reduce((s, p) => s + p.n, 0);
  return `<div class="scrim" data-act="close"></div><div class="modal" role="dialog" aria-label="Gerar tarefas">
  <header><h2>Gerar tarefas de ${compBR(S.comp)}</h2><button class="x" data-act="close" aria-label="Fechar">×</button></header>
  <div class="body"><div class="full">${total ? `<p>Serão criadas <b>${total}</b> tarefas para <b>${plano.filter(p => p.n).length}</b> clientes ativos, com vencimentos calculados pelo catálogo e pelos feriados cadastrados. Tarefas que já existem nesta competência ficam como estão.</p>`
    : `<p>Nada a gerar: todas as obrigações dos clientes ativos já têm tarefa em ${compBR(S.comp)}, ou nenhuma se aplica a este mês.</p>`}
  ${o.progress ? `<p class="mono">${o.progress}</p>` : ""}</div></div>
  <footer><span></span><span style="display:flex;gap:8px"><button class="btn" data-act="close">Cancelar</button>${total ? `<button class="btn primary" data-act="gerar-ok" ${o.running ? "disabled" : ""}>Gerar ${total} tarefas</button>` : ""}</span></footer></div>`;
}

// ---------- ações ----------
let toastT;
function toast(msg) {
  let el = document.querySelector(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3200);
}
function erro(e) {
  console.error(e);
  const code = e && e.code;
  toast(code === "invalid_argument" ? "Você não tem permissão para alterar este painel." : code === "quota_exceeded" ? "O banco do painel está cheio. Arquive competências antigas." : "Não foi possível salvar. Tente de novo.");
}
async function write(fn) { if (!S.db) { toast("Banco indisponível nesta visualização."); return false; } try { await fn(S.db); return true; } catch (e) { erro(e); return false; } }
const clone = x => JSON.parse(JSON.stringify(x || {}));
const openOv = o => { S.overlay = o; renderOverlay(); };
const closeOv = () => { S.overlay = null; renderOverlay(); };

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (["INPUT", "SELECT", "TEXTAREA", "FORM"].includes(el.tagName) && !["d-etapa", "o-reg"].includes(a)) return;
  if (a === "nav") { S.view = el.dataset.v; S.overlay = null; render(); }
  else if (a === "kpi") {
    const k = el.dataset.k;
    if (k === "aguard" || k === "cientes") { S.view = "protocolos"; S.protoF = k === "aguard" ? "abertos" : "cientes"; }
    else S.kpi = S.kpi === k ? null : k;
    render();
  }
  else if (a === "mode") { S.mode = el.dataset.m; render(); }
  else if (a === "limpar") { S.f = { q: "", resp: "", esfera: "", status: "" }; S.kpi = null; render(); }
  else if (a === "pf") { S.protoF = el.dataset.k; render(); }
  else if (a === "close") closeOv();
  else if (a === "item") { const t = byId(S.tarefas, el.dataset.t); if (t) openOv({ kind: "item", t: t.id, o: el.dataset.o, draft: clone(t.itens[el.dataset.o]) }); }
  else if (a === "d-etapa") {
    const d = S.overlay.draft, i = +el.dataset.i; d.etapas[i].ok = el.checked; d.etapas[i].em = el.checked ? hoje : null;
    const done = d.etapas.filter(e => e.ok).length;
    if (done === d.etapas.length && ["pendente", "andamento"].includes(d.status)) d.status = "concluida";
    else if (done > 0 && d.status === "pendente") d.status = "andamento";
    else if (done < d.etapas.length && d.status === "concluida") d.status = "andamento";
    if (d.status === "concluida" && !d.concluidaEm) d.concluidaEm = hoje;
    renderOverlay();
  }
  else if (a === "d-save") {
    const o = S.overlay, d = o.draft; if (d.valor === "") d.valor = null; else if (d.valor != null) d.valor = +d.valor;
    if (["concluida", "enviada", "ciente"].includes(d.status) && !d.concluidaEm) d.concluidaEm = hoje;
    if (await write(db => db.doc("tarefas/" + o.t).update({ itens: { [o.o]: d } }))) { closeOv(); toast("Tarefa salva"); }
  }
  else if (a === "proto") openOv({ kind: "proto", t: el.dataset.t, i: +el.dataset.i });
  else if (a === "p-ciente" || a === "p-reabrir") {
    const o = S.overlay, t = byId(S.tarefas, o.t), envs = clone({ e: t.envios }).e, e = envs[o.i];
    if (a === "p-ciente") {
      const dt = document.getElementById("p-data").value || hoje;
      Object.assign(e, { status: "ciente", cienteEm: dt + "T12:00:00", cienteDe: document.getElementById("p-quem").value.trim(), cienteVia: document.getElementById("p-via").value.trim() || "Confirmação manual" });
    } else Object.assign(e, { status: "aguardando", cienteEm: null, cienteDe: null, cienteVia: null });
    const itensUpd = {};
    for (const id of e.itens || []) { const it = (t.itens || {})[id]; if (!it) continue; if (a === "p-ciente" && it.status === "enviada") itensUpd[id] = { status: "ciente" }; if (a === "p-reabrir" && it.status === "ciente") itensUpd[id] = { status: "enviada" }; }
    if (await write(db => db.doc("tarefas/" + o.t).update({ envios: envs, ...(Object.keys(itensUpd).length ? { itens: itensUpd } : {}) }))) { toast(a === "p-ciente" ? "Ciência registrada" : "Ciência desfeita"); renderOverlay(); }
  }
  else if (a === "cli-new") openOv({ kind: "cli", id: null, draft: { regime: "Simples Nacional", ativo: true, obrigacoes: [] } });
  else if (a === "cli-edit") { const c = byId(S.clientes, el.dataset.id); if (c) openOv({ kind: "cli", id: c.id, draft: clone(c) }); }
  else if (a === "c-sugerir") {
    const reg = document.getElementById("c-regime").value;
    document.querySelectorAll('input[name="c-ob"]').forEach(cb => { const ob = byId(S.obrig, cb.value); if (ob && (ob.regimes || []).includes(reg)) cb.checked = true; });
  }
  else if (a === "c-del") { S.overlay.draft = lerCli(); S.overlay.confirmDel = true; renderOverlay(); }
  else if (a === "c-del-no") { S.overlay.draft = lerCli(); S.overlay.confirmDel = false; renderOverlay(); }
  else if (a === "c-del-yes") { const id = S.overlay.id; if (await write(db => db.doc("clientes/" + id).delete())) { closeOv(); toast("Cliente excluído"); } }
  else if (a === "ob-new") openOv({ kind: "ob", id: null, draft: { esfera: "Federal", tipo: "guia", periodicidade: "mensal", regra: "dia_fixo", dia: 20, mesOffset: 1, ajuste: "antecipa", lembrete: 5, regimes: [], enviaCliente: true } });
  else if (a === "ob-edit") { const o = byId(S.obrig, el.dataset.id); if (o) openOv({ kind: "ob", id: o.id, draft: clone(o) }); }
  else if (a === "o-reg") { const d = S.overlay.draft; d.regimes = [...document.querySelectorAll('input[name="o-reg"]:checked')].map(x => x.value); }
  else if (a === "o-del") { S.overlay.confirmDel = true; renderOverlay(); }
  else if (a === "o-del-no") { S.overlay.confirmDel = false; renderOverlay(); }
  else if (a === "o-del-yes") { const id = S.overlay.id; if (await write(db => db.doc("obrigacoes/" + id).delete())) { closeOv(); toast("Obrigação excluída"); } }
  else if (a === "pr-new") openOv({ kind: "pr", id: null, draft: { nome: "", etapas: [] } });
  else if (a === "pr-edit") { const p = byId(S.proc, el.dataset.id); if (p) openOv({ kind: "pr", id: p.id, draft: clone(p) }); }
  else if (a === "pr-del") {
    if (!S.overlay.confirmDel) { S.overlay.draft = { nome: document.getElementById("p-nome").value, etapas: document.getElementById("p-etapas").value.split("\n").map(s => s.trim()).filter(Boolean) }; S.overlay.confirmDel = true; renderOverlay(); return; }
    const id = S.overlay.id; if (await write(db => db.doc("processos/" + id).delete())) { closeOv(); toast("Processo excluído"); }
  }
  else if (a === "gerar") openOv({ kind: "gerar" });
  else if (a === "gerar-ok") {
    const plano = planoGeracao(S.comp).filter(p => p.n); S.overlay.running = true; let i = 0;
    for (const p of plano) {
      i++; S.overlay.progress = `Gravando ${i} de ${plano.length}: ${p.c.nome}`; renderOverlay();
      const ok = await write(db => p.existe
        ? db.doc("tarefas/" + p.id).update({ itens: p.novos })
        : db.doc("tarefas/" + p.id).set({ competencia: S.comp, clienteId: p.c.id, clienteNome: p.c.nome, criadoEm: new Date().toISOString(), itens: p.novos, envios: [] }));
      if (!ok) break;
    }
    closeOv(); toast(`Tarefas de ${compBR(S.comp)} geradas`);
  }
});
function lerCli() {
  return {
    ...(S.overlay.draft || {}),
    nome: document.getElementById("c-nome").value.trim(), cnpj: document.getElementById("c-cnpj").value.replace(/\D/g, ""),
    regime: document.getElementById("c-regime").value, resp: document.getElementById("c-resp").value.trim(), local: document.getElementById("c-local").value.trim(),
    emails: document.getElementById("c-emails").value.split(/[,;\s]+/).map(s => s.trim()).filter(Boolean),
    obrigacoes: [...document.querySelectorAll('input[name="c-ob"]:checked')].map(x => x.value),
    obs: document.getElementById("c-obs").value.trim(), ativo: document.getElementById("c-ativo").checked
  };
}
document.addEventListener("submit", async ev => {
  ev.preventDefault();
  const a = ev.target.dataset.act;
  if (a === "cli-save") {
    const c = lerCli(); delete c.id;
    const bad = c.emails.filter(e => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e));
    if (bad.length) { toast("E-mail inválido: " + bad.join(", ")); return; }
    const id = S.overlay.id || S.db?.collection("clientes").doc().id;
    if (await write(db => db.doc("clientes/" + id).set(c))) { closeOv(); toast("Cliente salvo"); }
  } else if (a === "ob-save") {
    const b = clone(S.overlay.draft); delete b.id;
    b.dia = +b.dia || 1; b.mesOffset = +b.mesOffset || 0; b.lembrete = +b.lembrete || 0; b.mesBase = +b.mesBase || 12;
    const id = S.overlay.id || (b.sigla || "ob").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + Math.random().toString(36).slice(2, 6);
    if (await write(db => db.doc("obrigacoes/" + id).set(b))) { closeOv(); toast("Obrigação salva"); }
  } else if (a === "pr-save") {
    const p = { nome: document.getElementById("p-nome").value.trim(), etapas: document.getElementById("p-etapas").value.split("\n").map(s => s.trim()).filter(Boolean) };
    const id = S.overlay.id || S.db?.collection("processos").doc().id;
    if (await write(db => db.doc("processos/" + id).set(p))) { closeOv(); toast("Processo salvo"); }
  } else if (a === "cfg-save") {
    const toIso = s => { s = s.trim(); const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? `${m[3]}-${m[2]}-${m[1]}` : /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : null; };
    const cfg = {
      ...S.cfg, nome: document.getElementById("cfg-nome").value.trim(), diasCobranca: +document.getElementById("cfg-dias").value || 3,
      responsaveis: document.getElementById("cfg-resp").value.split("\n").map(s => s.trim()).filter(Boolean),
      feriados: [...new Set(document.getElementById("cfg-fer").value.split("\n").map(toIso).filter(Boolean))].sort(),
      modeloAssunto: document.getElementById("cfg-assunto").value, modeloCorpo: document.getElementById("cfg-corpo").value, assinatura: document.getElementById("cfg-ass").value
    };
    delete cfg.id;
    if (await write(db => db.doc("config/escritorio").set(cfg))) toast("Configurações salvas");
  }
});
function onField(ev) {
  const el = ev.target, a = el.dataset.act; if (!a) return;
  if (a === "d-field") { S.overlay.draft[el.dataset.k] = el.value; if (ev.type === "change" && el.tagName === "SELECT" && el.dataset.k === "status") renderOverlay(); }
  else if (a === "o-f") {
    const d = S.overlay.draft; d[el.dataset.k] = el.type === "checkbox" ? el.checked : el.type === "number" ? +el.value : el.value;
    if (ev.type === "change" && el.tagName === "SELECT") renderOverlay();
    else { const pv = document.getElementById("o-prev"); if (pv) pv.innerHTML = previaOb(d); }
  }
  else if (a === "fq" && ev.type === "input") { S.f.q = el.value; renderListOnly(); }
  else if (ev.type !== "change") return;
  else if (a === "comp") { S.comp = el.value; S.kpi = null; render(); }
  else if (a === "newcomp") { if (/^\d{4}-\d{2}$/.test(el.value)) { S.comp = el.value; S.kpi = null; render(); } }
  else if (a === "fresp") { S.f.resp = el.value; render(); }
  else if (a === "fesf") { S.f.esfera = el.value; render(); }
  else if (a === "fst") { S.f.status = el.value; render(); }
}
function renderListOnly() {
  const pos = document.getElementById("f-q")?.selectionStart; render();
  const q = document.getElementById("f-q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) { } }
}
document.addEventListener("input", onField);
document.addEventListener("change", onField);
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && S.overlay) closeOv(); });

// ---------- dados ----------
let rt;
function schedule() { clearTimeout(rt); rt = setTimeout(() => {
  if (S.view === "config" && S.cfgRendered) { renderNav(); return; } if (!S.overlay || S.overlay.kind === "proto") render(); else renderNav(), rerenderMainKeepOverlay(); }, 30); }
function rerenderMainKeepOverlay() {
  // atualiza a área principal sem destruir o formulário aberto
  const v = S.view; let html = v === "agenda" ? viewAgenda() : v === "protocolos" ? viewProtocolos() : v === "clientes" ? viewClientes() : v === "obrigacoes" ? viewObrig() : v === "processos" ? viewProc() : v === "guias" ? viewGuias() : null;
  if (html != null) $main().innerHTML = html;
}
const docs = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
render();
(async () => {
  const db = window.claude ? await window.claude.use("db") : null;
  if (!db) { S.offline = true; render(); return; }
  S.db = db;
  const sub = (name, key) => db.collection(name).onSnapshot(s => { S[key] = docs(s); S.loaded[name] = true; schedule(); }, e => { console.error(e); S.loaded[name] = true; schedule(); });
  sub("clientes", "clientes"); sub("obrigacoes", "obrig"); sub("processos", "proc"); sub("tarefas", "tarefas");
  db.doc("config/escritorio").onSnapshot(s => { S.cfg = s.exists ? s.data() : {}; S.loaded.cfg = true; schedule(); }, e => console.error(e));
})();
</script>
